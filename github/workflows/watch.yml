name: Watch File
on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天 UTC 0点和12点,相当于北京时间早8点、晚8点
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download target file
        run: |
          mkdir -p current
          curl -sL -o current/bestcf-ip.txt "https://github.com/DustinWin/bestcf/releases/download/bestcf/bestcf-ip.txt"

      - name: Compare hash
        id: diff
        run: |
          mkdir -p hashes
          NEW_HASH=$(sha256sum current/bestcf-ip.txt | awk '{print $1}')
          OLD_HASH=$(cat hashes/bestcf-ip.txt.hash 2>/dev/null || echo "none")
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$NEW_HASH" > hashes/bestcf-ip.txt.hash
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="bestcf-ip.txt 文件已更新"

      - name: Commit new hash
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hashes/
          git commit -m "update hash"
          git push

