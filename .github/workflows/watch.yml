name: Watch File
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download target file
        run: |
          mkdir -p current
          curl -sL -o current/ctcc-ip.txt "https://github.com/DustinWin/bestcf/releases/download/bestcf/ctcc-ip.txt"

      - name: Compare hash
        id: diff
        run: |
          mkdir -p hashes
          NEW_HASH=$(sha256sum current/ctcc-ip.txt | awk '{print $1}')
          OLD_HASH=$(cat hashes/ctcc-ip.txt.hash 2>/dev/null || echo "none")
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$NEW_HASH" > hashes/ctcc-ip.txt.hash
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="ctcc-ip.txt 文件已更新"

      - name: Speed test IPs
        run: |
          set +e
          > result.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ip="${line%%#*}"
            clean_ip=$(echo "$ip" | tr -d '[]')
            data=$(curl -s -o /dev/null --max-time 8 \
              --resolve speed.cloudflare.com:443:"$clean_ip" \
              -w "%{time_connect} %{speed_download}" \
              "https://speed.cloudflare.com/__down?bytes=5000000" 2>/dev/null)
            ms=$(echo "$data" | awk '{print $1}')
            speed=$(echo "$data" | awk '{print $2}')
            if [ -n "$ms" ] && [ "$ms" != "0.000000" ] && [ -n "$speed" ]; then
              ms_int=$(awk "BEGIN{printf \"%d\", $ms*1000}")
              mbps=$(awk "BEGIN{printf \"%.1f\", $speed*8/1000000}")
              echo "$speed $ip $ms_int $mbps" >> result.txt
            fi
          done < current/ctcc-ip.txt
          sort -rn result.txt | head -5 | awk '{print $2"#"$3"ms_"$4"Mbps"}' > docs_data.txt
          cat docs_data.txt

      - name: Build outputs
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          cp docs_data.txt docs/data.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hashes/ docs/
          git diff --cached --quiet || git commit -m "update data"
          git push
