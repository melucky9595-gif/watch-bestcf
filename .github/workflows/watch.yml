name: Watch File
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare IP list
        run: |
          cat > current_list.txt << 'EOF'
          108.162.198.14:2083#jp 【日本14】 JP
          108.162.198.11:2083#jp 【日本11】 JP
          108.162.198.13:2083#jp 【日本13】 JP
          108.162.198.5:2083#jp 【日本5】 JP
          108.162.198.6:2083#jp 【日本6】 JP
          108.162.198.16:2083#jp 【日本16】 JP
          108.162.198.4:2083#jp 【日本4】 JP
          108.162.198.8:2083#jp 【日本8】 JP
          108.162.198.1:2083#jp 【日本1】 JP
          108.162.198.12:2083#jp 【日本12】 JP
          108.162.198.18:2083#jp 【日本18】 JP
          108.162.198.10:2083#jp 【日本10】 JP
          108.162.198.15:2083#jp 【日本15】 JP
          108.162.198.2:2083#jp 【日本2】 JP
          108.162.198.9:2083#jp 【日本9】 JP
          108.162.198.17:2083#jp 【日本17】 JP
          108.162.198.7:2083#jp 【日本7】 JP
          108.162.198.19:2083#jp 【日本19】 JP
          108.162.198.3:2083#jp 【日本3】 JP
          EOF

      - name: Long-term stability test (30s per IP)
        run: |
          set +e
          > result.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ip_port="${line%%#*}"
            note="${line#*#}"
            ip="${ip_port%%:*}"
            port="${ip_port#*:}"

            success=0
            total=0
            total_ms=0
            end_time=$((SECONDS+30))

            while [ $SECONDS -lt $end_time ]; do
              ms=$(curl -s -o /dev/null --max-time 3 \
                --resolve speed.cloudflare.com:"$port":"$ip" \
                -w "%{time_connect}" \
                "https://speed.cloudflare.com:$port/__down?bytes=1000" 2>/dev/null)
              total=$((total+1))
              if [ -n "$ms" ] && [ "$ms" != "0.000000" ]; then
                ms_int=$(awk "BEGIN{printf \"%.0f\", $ms*1000}")
                success=$((success+1))
                total_ms=$((total_ms+ms_int))
              fi
              sleep 1
            done

            if [ "$success" -gt 0 ]; then
              avg_ms=$((total_ms/success))
            else
              avg_ms=9999
            fi
            rate=$(awk "BEGIN{printf \"%.0f\", $success*100/$total}")

            echo "$rate $avg_ms ${ip_port}#${note}_存活${rate}%_${avg_ms}ms" >> result.txt
          done < current_list.txt
          sort -k1,1nr -k2,2n result.txt | awk '{$1="";$2=""; print substr($0,3)}' > docs_data.txt
          cat docs_data.txt

      - name: Notify Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="日本节点测速已更新"

      - name: Build outputs
        run: |
          mkdir -p docs
          touch docs/.nojekyll
          cp docs_data.txt docs/data.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "update data"
          git push
